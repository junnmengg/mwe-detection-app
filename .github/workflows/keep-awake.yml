name: Keep demo awake

# Streamlit Community Cloud suspends an app after 12 hours without traffic, so
# the first visitor to a sleeping demo waits through a cold start. This
# workflow visits the app in a real browser often enough to prevent that, and
# wakes it if it has already slept.
#
# Reliability notes, because none of this is guaranteed:
#   * GitHub's `schedule` trigger is best effort and is routinely delayed under
#     load. The interval is 4 hours against a 12-hour threshold, so three
#     consecutive runs must be lost before the app can sleep.
#   * GitHub disables scheduled workflows after 60 days without repository
#     activity. The `keepalive` job below prevents that.
#   * A run fails loudly if it cannot confirm the app is serving, and uploads a
#     screenshot plus the page HTML so the reason is visible.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

env:
  APP_URL: https://fyp-mwedetection.streamlit.app/
  ARTIFACT_DIR: artifacts

jobs:
  ping:
    name: Visit the hosted demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Puppeteer
        run: npm install --no-save --no-fund --no-audit puppeteer@^23

      # A real browser opens the WebSocket that Streamlit uses for genuine
      # sessions. A plain HTTPS request only fetches the page shell, and
      # Streamlit does not document whether that counts as traffic.
      - name: Visit the app, waking it if necessary
        run: node .github/scripts/keep-awake.mjs

      # Only produced when the script could not confirm the app was serving.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-diagnostics-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: ignore
          retention-days: 14

  keepalive:
    name: Keep the schedule enabled
    needs: ping
    # Runs even when the ping fails: a broken demo must not also silence the
    # schedule 60 days later.
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Separated from `ping` so that the job running third-party npm packages
    # never holds write access to the repository.
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, silently. An empty commit every 50 days resets that clock.
      # It also triggers a Streamlit redeploy, which is harmless roughly seven
      # times a year.
      - name: Push an empty commit if the repository is going quiet
        run: |
          set -euo pipefail
          last_commit_epoch=$(git log -1 --format=%ct)
          days_since=$(( ( $(date +%s) - last_commit_epoch ) / 86400 ))
          echo "Last commit was ${days_since} day(s) ago."

          if [ "${days_since}" -lt 50 ]; then
            echo "Well inside the 60-day window; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows enabled"
          git push
