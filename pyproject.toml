[project]
name = "mwe-detection-app"
version = "1.1.0"
description = "Detect multi-word expressions in English text with four fine-tuned sequence-labelling models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wong Jun Meng" }]
keywords = ["nlp", "multiword-expressions", "bert", "roberta", "crf", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/junnmengg/mwe-detection-app"
Demo = "https://fyp-mwedetection.streamlit.app/"
Issues = "https://github.com/junnmengg/mwe-detection-app/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # docstrings
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "D107",  # constructor arguments are documented on the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]
# app.py embeds the v1.0 sidebar stylesheet verbatim. Rewrapping it would be a
# cosmetic change to a string this project has committed to keeping identical.
"app.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
# The project uses flat modules at the repository root rather than a src/
# package, so the root must be on sys.path for `from config import ...` to
# resolve. Without this, a bare `pytest` fails while `python -m pytest`
# succeeds, because only the latter puts the working directory on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Doctests live in config.py and text_processing.py and are executed by
# tests/test_doctests.py. They are deliberately NOT collected via
# --doctest-modules: that flag also walks the test files themselves, which
# collects each of them twice and reports every failure in duplicate.
