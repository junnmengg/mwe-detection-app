name: Keep demo awake

# Streamlit Community Cloud suspends apps after a period of inactivity.
# A plain HTTPS request is enough to reset that timer, so this workflow no
# longer installs a headless browser: it runs in seconds instead of minutes.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping the hosted demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the app
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location \
                        --retry 3 --retry-delay 10 --max-time 90 \
                        --output /dev/null --write-out '%{http_code}' \
                        "${APP_URL}")
          echo "HTTP ${status} from ${APP_URL}"
          test "${status}" -lt 400
        env:
          APP_URL: https://fyp-mwedetection.streamlit.app/
