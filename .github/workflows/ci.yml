name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite covers only the pure-Python layer, so PyTorch and
      # Transformers are deliberately not installed: they add several minutes
      # and gigabytes to every run for no extra coverage.
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6,<1.0" "pytest>=8.0,<9.0" "pytest-cov>=5.0,<7.0"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=text_processing --cov=config --cov-report=term-missing

  imports:
    name: Import the full application
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # Catches import errors, bad annotations and registry mistakes that the
      # lightweight job cannot see, without needing model weights.
      - name: Byte-compile and import every module
        run: |
          python -m compileall -q .
          python -c "import config, models, text_processing"
